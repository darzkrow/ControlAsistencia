[package]
name = "captador_huellas"
version = "0.1.0"
edition = "2024"

[dependencies]
# Framework web y runtime asíncrono
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }

# Conexión a PostgreSQL
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "chrono"] }

# Serialización / Deserialización de JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Manejo de fechas y horas
chrono = { version = "0.4", features = ["serde"] }

# Cargar variables de entorno desde un archivo .env
dotenvy = "0.15"

# Permisos CORS para conectar el frontend/lector web
tower-http = { version = "0.5", features = ["cors"] }
#librerias de opencv
opencv = "0.91"
base64 = "0.22"
uuid = { version = "1.8", features = ["v4"] }
